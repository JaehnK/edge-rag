name: Run Evaluation

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "BEIR dataset name"
        required: true
        default: "scifact"
        type: string
      base_url:
        description: "RAG API base URL"
        required: true
        default: "http://127.0.0.1:8000"
        type: string
      split:
        description: "BEIR split"
        required: true
        default: "test"
        type: string
      data_dir:
        description: "BEIR data directory on the VM"
        required: true
        default: "beir_data"
        type: string
      advanced_modes:
        description: "Comma-separated Advanced RAG modes"
        required: false
        default: "none,query_rewrite,hyde,rerank,sentence_window,contextual_compression"
        type: string
      use_async:
        description: "Use async HTTP requests"
        required: true
        default: false
        type: boolean
      concurrency:
        description: "Concurrency for async mode"
        required: true
        default: "1"
        type: string
      limit:
        description: "Optional query limit for smoke runs"
        required: false
        default: ""
        type: string
      ragas_metrics:
        description: "Comma-separated ragas metric names"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate evaluation settings
        env:
          VM_APP_DIR: ${{ vars.VM_APP_DIR }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          VM_APP_DIR="${VM_APP_DIR:-/home/$VM_USER/edge_rag_server}"
          VM_SSH_PORT="${VM_SSH_PORT:-22}"
          test -n "$VM_HOST" || { echo "Missing GitHub secret: VM_HOST"; exit 1; }
          test -n "$VM_USER" || { echo "Missing GitHub secret: VM_USER"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "Missing GitHub secret: VM_SSH_KEY"; exit 1; }
          test -n "$VM_APP_DIR" || { echo "Unable to determine VM_APP_DIR"; exit 1; }
          test -n "$VM_SSH_PORT" || { echo "Unable to determine VM_SSH_PORT"; exit 1; }

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
        run: |
          set -euo pipefail
          VM_SSH_PORT="${VM_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VM_SSH_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run evaluation on VM
        env:
          ADVANCED_MODES: ${{ inputs.advanced_modes }}
          BASE_URL: ${{ inputs.base_url }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DATA_DIR: ${{ inputs.data_dir }}
          DATASET: ${{ inputs.dataset }}
          EVAL_OUTPUT_DIR: reports/github-${{ github.run_id }}
          LIMIT: ${{ inputs.limit }}
          RAGAS_METRICS: ${{ inputs.ragas_metrics }}
          SPLIT: ${{ inputs.split }}
          USE_ASYNC: ${{ inputs.use_async }}
          VM_APP_DIR: ${{ vars.VM_APP_DIR }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          VM_APP_DIR="${VM_APP_DIR:-/home/$VM_USER/edge_rag_server}"
          VM_SSH_PORT="${VM_SSH_PORT:-22}"
          args=(python scripts/run_experiment.py --dataset "$DATASET" --data-dir "$DATA_DIR" --base-url "$BASE_URL" --split "$SPLIT" --concurrency "$CONCURRENCY" --output-dir "$EVAL_OUTPUT_DIR")

          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi

          if [ "$USE_ASYNC" = "true" ]; then
            args+=(--async)
          fi

          if [ -n "$RAGAS_METRICS" ]; then
            IFS=',' read -r -a metrics <<< "$RAGAS_METRICS"
            for metric in "${metrics[@]}"; do
              metric="${metric#"${metric%%[![:space:]]*}"}"
              metric="${metric%"${metric##*[![:space:]]}"}"
              if [ -n "$metric" ]; then
                args+=(--ragas-metric "$metric")
              fi
            done
          fi

          if [ -n "$ADVANCED_MODES" ]; then
            IFS=',' read -r -a modes <<< "$ADVANCED_MODES"
            for mode in "${modes[@]}"; do
              mode="${mode#"${mode%%[![:space:]]*}"}"
              mode="${mode%"${mode##*[![:space:]]}"}"
              if [ -n "$mode" ]; then
                args+=(--mode "$mode")
              fi
            done
          fi

          printf -v escaped_args ' %q' "${args[@]}"

          ssh -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" "
            set -euo pipefail
            cd '$VM_APP_DIR'
            ~/.local/bin/uv run${escaped_args}
          "

      - name: Fetch evaluation results
        if: always()
        env:
          EVAL_OUTPUT_DIR: reports/github-${{ github.run_id }}
          VM_APP_DIR: ${{ vars.VM_APP_DIR }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          VM_APP_DIR="${VM_APP_DIR:-/home/$VM_USER/edge_rag_server}"
          VM_SSH_PORT="${VM_SSH_PORT:-22}"
          mkdir -p evaluation-results
          scp -P "$VM_SSH_PORT" -r \
            "$VM_USER@$VM_HOST:$VM_APP_DIR/$EVAL_OUTPUT_DIR/." \
            evaluation-results/

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.run_id }}
          path: evaluation-results/
          if-no-files-found: warn
